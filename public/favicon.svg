<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer container with rounded corners and dark gradient -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#goldGradient)" stroke-width="8" opacity="0.85" />
  
  <!-- Tech Grid Background Accents -->
  <circle cx="100" cy="100" r="4" fill="#EAB308" opacity="0.3" />
  <circle cx="412" cy="100" r="4" fill="#EAB308" opacity="0.3" />
  <circle cx="100" cy="412" r="4" fill="#EAB308" opacity="0.3" />
  <circle cx="412" cy="412" r="4" fill="#EAB308" opacity="0.3" />
  
  <!-- Inner Circuit Frame -->
  <path d="M 120 70 L 392 70 M 70 120 L 70 392 M 442 120 L 442 392 M 120 442 L 392 442" stroke="#EAB308" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  
  <!-- Central Stylized "K" Kogla Tech Monogram Shield -->
  <g filter="url(#glow)">
    <!-- Vertical Pillar -->
    <path d="M 148 128 L 208 128 L 208 384 L 148 384 Z" fill="url(#goldGradient)" />
    
    <!-- Top-Right Diagonal Branch -->
    <path d="M 208 260 L 332 128 L 396 128 L 256 280 Z" fill="url(#goldGradient)" />
    
    <!-- Bottom-Right Diagonal Branch -->
    <path d="M 238 250 L 396 384 L 328 384 L 198 274 Z" fill="url(#goldGradient)" />
    
    <!-- Tech Accent Node -->
    <polygon points="396,128 412,128 412,144 396,144" fill="#FDE047" />
    <polygon points="396,368 412,368 412,384 396,384" fill="#FDE047" />
    <circle cx="208" cy="260" r="8" fill="#FDE047" />
  </g>
</svg>
