<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Metallic Gold Gradients matching official Kogla Tech Medallion -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#F3DC75" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEA" />
      <stop offset="50%" stop-color="#F1D56D" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#734B0B" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="85%" stop-color="#070708" />
      <stop offset="100%" stop-color="#020203" />
    </radialGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Matte Black Circular Medallion -->
  <circle cx="256" cy="256" r="254" fill="url(#bgGlow)" />

  <!-- Outer Concentric Golden Rings -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="url(#goldGradient)" stroke-width="2.2" opacity="0.9" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.35" />

  <!-- Four Cardinal Accent Dots -->
  <circle cx="256" cy="14" r="4" fill="url(#goldLight)" />
  <circle cx="498" cy="256" r="4" fill="url(#goldLight)" />
  <circle cx="256" cy="498" r="4" fill="url(#goldLight)" />
  <circle cx="14" cy="256" r="4" fill="url(#goldLight)" />

  <!-- Central Kogla Tech Monogram Emblem -->
  <g filter="url(#subtleGlow)">
    <!-- Top Diamond Finial -->
    <polygon points="256,98 268,114 256,130 244,114" fill="url(#goldLight)" />

    <!-- Top Horizontal Bar -->
    <path d="M 138 132 L 376 132 L 376 162 L 138 162 Z" fill="url(#goldGradient)" />

    <!-- Center Vertical Pillar -->
    <path d="M 240 132 L 272 132 L 272 370 L 256 392 L 240 370 Z" fill="url(#goldGradient)" />

    <!-- Left Angular Fold ("K" Chevron Ribbon) -->
    <!-- Lower Diagonal Leg -->
    <polygon points="152,374 186,374 256,252 240,230 152,348" fill="url(#goldDark)" />
    <polygon points="160,374 194,374 260,252 248,236" fill="url(#goldGradient)" opacity="0.9" />

    <!-- Upper Diagonal Leg -->
    <polygon points="166,132 186,132 258,248 238,252" fill="url(#goldLight)" />
    <polygon points="150,146 174,132 244,244 230,248" fill="url(#goldGradient)" />

    <!-- Bottom Chevron Tip Accent -->
    <polygon points="256,398 266,384 246,384" fill="url(#goldLight)" />
  </g>

  <!-- Official Brand Name Typography -->
  <text x="256" y="442" text-anchor="middle" font-family="'Cinzel', 'Montserrat', 'Inter', sans-serif" font-weight="700" font-size="27" letter-spacing="6.5" fill="url(#goldGradient)">KOGLA TECH</text>
</svg>
