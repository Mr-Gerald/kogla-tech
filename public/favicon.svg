<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGlow)" />
  
  <!-- Outer Gold Frame -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#goldLinear)" stroke-width="14" stroke-opacity="0.9" />
  
  <!-- Inner Subtle Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldLight)" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="12 8" />

  <!-- Center Kogla Tech Geometric Crest / Monogram (KT) -->
  <g transform="translate(0, 0)">
    <!-- Central Technology Vertical Stem -->
    <rect x="240" y="118" width="32" height="276" rx="12" fill="url(#goldLinear)" />

    <!-- Top Crossbar of T -->
    <path d="M 128 152 C 128 138 138 128 152 128 L 360 128 C 374 128 384 138 384 152 L 384 172 C 384 186 374 196 360 196 L 290 196 L 290 196 L 222 196 L 152 196 C 138 196 128 186 128 172 Z" fill="url(#goldLight)" />

    <!-- Left K-Branch / Neural Node -->
    <path d="M 238 238 L 148 168 C 138 160 124 164 120 176 L 112 196 C 108 208 114 220 124 228 L 210 292 Z" fill="url(#goldLinear)" />
    <path d="M 238 274 L 142 346 C 132 354 128 368 134 378 L 146 396 C 152 406 166 408 176 400 L 250 338 Z" fill="url(#goldLight)" />

    <!-- Right K-Branch / Tech Circuit Node -->
    <path d="M 274 238 L 364 168 C 374 160 388 164 392 176 L 400 196 C 404 208 398 220 388 228 L 302 292 Z" fill="url(#goldLinear)" />
    <path d="M 274 274 L 370 346 C 380 354 384 368 378 378 L 366 396 C 360 406 346 408 336 400 L 262 338 Z" fill="url(#goldLight)" />

    <!-- Core Nexus Diamond in Gold -->
    <polygon points="256,220 286,256 256,292 226,256" fill="#FEF08A" stroke="url(#goldLinear)" stroke-width="4" />
  </g>
</svg>
